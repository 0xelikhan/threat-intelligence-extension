<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copilot Prompt</title>
  <link rel="stylesheet" href="copilot.css">
</head>
<body>
  <header class="ti-header">
    <span class="ti-logo">◇</span>
    <span class="ti-title">Copilot Prompt</span>
    <span class="ti-count"><span id="chars">0</span> chars</span>
  </header>
  <textarea id="prompt" spellcheck="false" autofocus></textarea>
  <footer class="ti-actions">
    <button id="copy">Copy</button>
    <button id="copy-open" class="primary">Copy &amp; Open Copilot</button>
  </footer>
  <div id="toast" class="ti-toast" hidden></div>
  <script src="copilot.js"></script>
</body>
</html>

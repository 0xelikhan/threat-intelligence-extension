<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Threat Intelligence</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="ti-header">
    <div class="ti-brand">
      <span class="ti-logo">◇</span>
      <span class="ti-title">Threat Intelligence</span>
    </div>
    <div class="ti-actions">
      <button id="rescan" title="Rescan tab">↻</button>
      <button id="settings-btn" title="Settings">⚙</button>
    </div>
  </header>

  <section class="ti-search">
    <textarea id="pastebox" placeholder="Paste IOC or text" spellcheck="false"></textarea>
    <div class="ti-search-actions">
      <button id="parse-btn" class="primary">Enrich</button>
      <button id="scan-page-btn">Scan Page</button>
      <button id="clear-btn" class="ghost">Clear</button>
    </div>
  </section>

  <section class="ti-toolbar">
    <div class="ti-count"><span id="ioc-count">0</span> IOCs</div>
    <div class="ti-toolbar-actions">
      <button id="copy-report">Report</button>
      <button id="send-copilot" class="primary-ghost">Copilot</button>
    </div>
  </section>

  <main id="ioc-list" class="ti-list"></main>

  <div id="modal" class="ti-modal" hidden>
    <div class="ti-modal-backdrop"></div>
    <div class="ti-modal-card">
      <div class="ti-modal-head">
        <span>Copilot Prompt</span>
        <button id="modal-close">×</button>
      </div>
      <textarea id="modal-prompt" spellcheck="false"></textarea>
      <div class="ti-modal-actions">
        <button id="modal-copy">Copy</button>
        <button id="modal-copy-open" class="primary">Copy &amp; Open Copilot</button>
      </div>
    </div>
  </div>

  <div id="toast" class="ti-toast" hidden></div>

  <script src="../lib/parser.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>

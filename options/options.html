<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Threat Intelligence Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="ti-wrap">
    <header class="ti-header">
      <span class="ti-logo">◇</span>
      <span class="ti-title">Threat Intelligence</span>
    </header>

    <section class="ti-section">
      <h2>API Keys</h2>
      <div class="ti-field">
        <label>VirusTotal</label>
        <input id="vt" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://www.virustotal.com/gui/my-apikey" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>AbuseIPDB</label>
        <input id="aipb" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://www.abuseipdb.com/account/api" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>GreyNoise</label>
        <input id="gn" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://viz.greynoise.io/account/api-key" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>ProxyCheck</label>
        <input id="proxycheck" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://proxycheck.io/dashboard/" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>IPInfo</label>
        <input id="ipinfo" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://ipinfo.io/account/token" target="_blank" rel="noopener">Get token</a>
      </div>
      <div class="ti-field">
        <label>Shodan</label>
        <input id="shodan" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://account.shodan.io/" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>AlienVault OTX</label>
        <input id="otx" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://otx.alienvault.com/api" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>URLScan</label>
        <input id="urlscan" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://urlscan.io/user/profile/" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>CrowdSec</label>
        <input id="crowdsec" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://app.crowdsec.net/settings/api-keys" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>Pulsedive</label>
        <input id="pulsedive" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://pulsedive.com/account/" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>Censys ID</label>
        <input id="censys_id" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://search.censys.io/account/api" target="_blank" rel="noopener">Get ID + Secret</a>
      </div>
      <div class="ti-field">
        <label>Censys Secret</label>
        <input id="censys_secret" type="password" autocomplete="off" spellcheck="false">
        <span class="ti-hint" style="opacity:0.4">pair w/ ID</span>
      </div>
      <div class="ti-field">
        <label>Hybrid Analysis</label>
        <input id="hybrid_analysis" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://www.hybrid-analysis.com/apikeys/info" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>Any.Run</label>
        <input id="anyrun" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://app.any.run/profile/" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>FullHunt</label>
        <input id="fullhunt" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://fullhunt.io/user/settings/" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>Polyswarm</label>
        <input id="polyswarm" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://polyswarm.network/account/api-keys" target="_blank" rel="noopener">Get key</a>
      </div>
      <div class="ti-field">
        <label>IntelligenceX</label>
        <input id="intelx" type="password" autocomplete="off" spellcheck="false">
        <a class="ti-hint" href="https://intelx.io/account?tab=developer" target="_blank" rel="noopener">Get key</a>
      </div>
    </section>

    <section class="ti-section">
      <h2>Custom Sources</h2>
      <div id="custom-list"></div>
      <button id="add-custom" class="ghost">+ Add</button>
    </section>

    <section class="ti-section">
      <h2>Behavior</h2>
      <label class="ti-switch">
        <input id="autoscan" type="checkbox">
        <span>Auto-scan pages</span>
      </label>
      <label class="ti-switch">
        <input id="hover" type="checkbox">
        <span>Hover tooltips</span>
      </label>
      <label class="ti-switch">
        <input id="private-ips" type="checkbox">
        <span>Skip private IPs</span>
      </label>
      <label class="ti-switch">
        <input id="known-tld" type="checkbox">
        <span>Require known TLD</span>
      </label>
      <label class="ti-switch">
        <input id="defang-copy" type="checkbox">
        <span>Defang on copy</span>
      </label>
      <label class="ti-switch">
        <input id="gti-enabled" type="checkbox">
        <span>Google Threat Intelligence (GTI) fields</span>
      </label>
      <label class="ti-switch">
        <input id="vt-behavior" type="checkbox">
        <span>VT sandbox behavior for hashes</span>
      </label>
    </section>

    <section class="ti-section">
      <h2>Data</h2>
      <div class="ti-buttons">
        <button id="export-cfg">Export config</button>
        <button id="import-cfg">Import config</button>
        <button id="clear-case" class="danger">Clear case notes</button>
      </div>
      <input id="import-file" type="file" accept="application/json" hidden>
    </section>

    <div class="ti-save-bar">
      <button id="save" class="primary">Save</button>
      <span id="saved" class="ti-saved" hidden>Saved</span>
    </div>
  </div>

  <template id="custom-tpl">
    <div class="ti-custom">
      <input class="c-name" placeholder="Name" spellcheck="false">
      <input class="c-url" placeholder="https://api.example.com/lookup/{ioc}" spellcheck="false">
      <input class="c-header" placeholder="X-Api-Key" spellcheck="false">
      <input class="c-key" type="password" placeholder="key" autocomplete="off" spellcheck="false">
      <button class="c-remove">×</button>
    </div>
  </template>

  <script src="options.js"></script>
</body>
</html>
